# CareFlow Render Blueprint — apply-ready for staging.
# NFR-AVAIL-01 is unspecified — this file does not claim production uptime.
#
# Values come from the Render dashboard / secret store (sync: false).
# Do not put secret values in this file.
#
# Staging DB shortcut: Render's single connectionString is wired to BOTH
# DATABASE_URL and DATABASE_ADMIN_URL (Alembic + app run as the Render DB
# owner). Dual careflow / careflow_owner roles + RLS isolation stay a
# follow-up — do not invent CREATE ROLE here.
#
# After attach, enable extensions vector (pgvector), cube, and earthdistance
# on the instance (compose init does this locally; dashboard SQL on Render).
# pgvector is required (D-001).
#
# API container listens on $PORT (default 8000 locally). Health: GET /health.

services:
  - type: web
    name: careflow-api
    runtime: docker
    plan: starter  # legacy alias for 0.5c-512mb; paid Starter required for Docker
    branch: dev
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Same Render connectionString for both — staging shortcut (see header).
      - key: DATABASE_URL
        fromDatabase:
          name: careflow-db
          property: connectionString
      - key: DATABASE_ADMIN_URL
        fromDatabase:
          name: careflow-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          name: careflow-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEMO_NOTIFY
        value: "1"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      # Premade Daniel - Steady Broadcaster (not a secret). Locks staging TTS.
      - key: ELEVENLABS_VOICE_ID
        value: onwK4e9ZLuTAKqWW03F9
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: PAWA_AI_API_KEY
        sync: false

  - type: web
    name: careflow-web
    runtime: node
    plan: starter
    branch: dev
    autoDeployTrigger: checksPass
    # Repo root so ./build.sh is in the build context (files outside rootDir
    # are unavailable). buildFilter restores frontend-only autodeploys.
    buildCommand: ./build.sh
    startCommand: cd frontend && npm run start  # PORT from frontend/package.json: next start --port ${PORT:-3000}
    healthCheckPath: /
    buildFilter:
      paths:
        - frontend/**
        - build.sh
    envVars:
      - key: NODE_VERSION
        value: "20"
      # NEXT_PUBLIC_* is build-time — first web deploy may need a rebuild
      # after the API hostname exists.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: careflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: careflow-db
    databaseName: careflow
    postgresMajorVersion: "16"
    # Omit plan — default / free trial is accepted.
    # After attach, enable vector, cube, and earthdistance on the instance.
